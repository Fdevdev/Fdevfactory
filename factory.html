<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FDEV Factory</title>

<link rel="stylesheet" href="css/style.css">

<style>
body {
  background: #0a0a0a;
  color: white;
  font-family: Arial;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: 50px auto;
}

.card {
  background: #111;
  padding: 20px;
  margin: 20px 0;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(255,180,0,0.2);
}

button {
  background: orange;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}

h1 {
  color: orange;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

<div class="logo" onclick="window.location.href='index.html'">
  <img src="images/logo.webp">
  <span>$FDEV</span>
</div>

<nav>
<a href="index.html#story">Factory Story</a>
<a href="index.html#tokenomics">Tokenomics</a>
<a href="index.html#roadmap">Roadmap</a>
<a href="index.html#buy">How to Buy</a>
<a href="factory.html">Factory</a>
</nav>

<div class="nav-right">
  <button class="connect-wallet" onclick="connectWallet()">
    <span id="wallet">Connect Wallet</span>
  </button>
  <span id="points-nav">0</span>
</div>

</header>

<!-- CONTENT -->
<div class="container">

<h1>🏭 FDEV Factory</h1>

<div class="card">
  <p>Name: <span id="displayName">Guest</span></p>

  <input id="usernameInput" placeholder="Enter your name..." />
  <button onclick="saveName()">Save</button>

  <p>Points: <span id="points">0</span></p>
</div>

<div class="card">
  <h2>⚡ Factory Work</h2>
  <button onclick="addPoint()">Produce $FDEV</button>
</div>
<div class="box">
  <h3>🎯 Tasks</h3>

  <div class="task">
    <p>Follow Twitter (+10)</p>
    <button onclick="startTask(this, 'twitter')">Start</button>
  </div>

  <div class="task">
    <p>Join Telegram (+10)</p>
    <button onclick="startTask(this, 'telegram')">Start</button>
  </div>

  <div class="task">
    <p>Retweet Post (+20)</p>
    <button onclick="startTask(this, 'retweet')">Start</button>
  </div>

</div>

<div class="card">
  <h2>🏆 Leaderboard</h2>
  <div id="leaderboard"></div>
</div>

</div>

<div id="coin-container"></div>

script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>
<script src="js/main.js"></script>

</body>
</html>
